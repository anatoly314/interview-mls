syntax = "proto3";

package mls.v1;

option go_package = "github.com/anatolyt/interview-mls/proto/gen/jobsv1";

// JobEvents is served by the api. Each worker opens exactly one long-lived
// stream at startup and keeps it for the life of the process.
//
// It is bidirectional because cancellation is a routing problem: pg_notify
// broadcasts, but a cancel has to reach the one worker currently holding the
// job's lease. Status events flow worker->api and are fanned out to websocket
// clients; control commands flow api->worker.
service JobEvents {
  rpc Connect(stream WorkerEvent) returns (stream Command);
}

enum JobStatus {
  JOB_STATUS_UNSPECIFIED = 0;
  JOB_STATUS_QUEUED = 1;
  JOB_STATUS_PROCESSING = 2;
  JOB_STATUS_DONE = 3;
  JOB_STATUS_FAILED = 4;
}

enum CommandType {
  COMMAND_TYPE_UNSPECIFIED = 0;
  COMMAND_TYPE_CANCEL = 1;
}

message WorkerEvent {
  string job_id = 1;
  JobStatus status = 2;
  // set only when status == FAILED or a retry is queued after an error
  string error = 3;
  // identifies the sender so the api can route commands back to it
  string worker_id = 4;
}

message Command {
  string job_id = 1;
  CommandType type = 2;
}
