services:
  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001" # web console, handy for inspecting uploaded objects
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 3s
      timeout: 3s
      retries: 20

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mls
      POSTGRES_PASSWORD: mls
      POSTGRES_DB: mls
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mls"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    environment:
      HTTP_ADDR: ":8080"
      GRPC_ADDR: ":9090"
      POSTGRES_DSN: postgres://mls:mls@postgres:5432/mls?sslmode=disable
      MINIO_ENDPOINT: minio:9000
    ports:
      - "8080:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 3s
      timeout: 3s
      retries: 20
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: services/worker/Dockerfile
    deploy:
      replicas: 2
    restart: unless-stopped
    environment:
      POSTGRES_DSN: postgres://mls:mls@postgres:5432/mls?sslmode=disable
      MINIO_ENDPOINT: minio:9000
      API_GRPC_ADDR: api:9090
      PARSE_DELAY: 2s
      LEASE_DURATION: 60s
      POLL_INTERVAL: 5s
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      api:
        condition: service_healthy

volumes:
  minio-data:
  postgres-data:
