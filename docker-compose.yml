services:
  redpanda:
    image: redpandadata/redpanda:v24.3.6
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
    ports:
      - "19092:19092" # external listener for running services outside docker during development
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true'"]
      interval: 3s
      timeout: 3s
      retries: 20

  topic-init:
    image: redpandadata/redpanda:v24.3.6
    depends_on:
      redpanda:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    # create-if-missing: a real create failure still exits non-zero,
    # unlike `create || true` which would swallow it
    command:
      - >
        rpk topic list -X brokers=redpanda:9092 | awk '{print $1}' | grep -qx jobs ||
        rpk topic create jobs --partitions 8 -X brokers=redpanda:9092

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001" # web console, handy for inspecting uploaded objects
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 3s
      timeout: 3s
      retries: 20

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mls
      POSTGRES_PASSWORD: mls
      POSTGRES_DB: mls
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mls"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    environment:
      HTTP_ADDR: ":8080"
      GRPC_ADDR: ":9090"
      POSTGRES_DSN: postgres://mls:mls@postgres:5432/mls?sslmode=disable
      KAFKA_BROKERS: redpanda:9092
      MINIO_ENDPOINT: minio:9000
    ports:
      - "8080:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 3s
      timeout: 3s
      retries: 20
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      topic-init:
        condition: service_completed_successfully

  worker:
    build:
      context: .
      dockerfile: services/worker/Dockerfile
    deploy:
      replicas: 2
    restart: unless-stopped
    environment:
      POSTGRES_DSN: postgres://mls:mls@postgres:5432/mls?sslmode=disable
      KAFKA_BROKERS: redpanda:9092
      MINIO_ENDPOINT: minio:9000
      API_GRPC_ADDR: api:9090
      PARSE_DELAY: 2s
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      topic-init:
        condition: service_completed_successfully
      api:
        condition: service_healthy

volumes:
  redpanda-data:
  minio-data:
  postgres-data:
